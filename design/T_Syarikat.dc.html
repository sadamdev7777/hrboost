.r:first-child{border-top:none}
.r .l{color:#5B6B68;flex-grow:1}
.r input,.r select{width:150px;height:36px;box-sizing:border-box;border:1px solid #D5DEDC;border-radius:10px;padding:0 10px;font-family:inherit;font-size:13px;font-weight:700;color:#14211F;background:#FFFFFF;text-align:right}

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 2px 20px 10px">
    <span class="sec">SYARIKAT</span>
    <div class="box">
      <label class="r"><span class="l">Nama</span><input type="text" value="MUSLIMTRAVELBUG SDN BHD" style="width: 190px"></label>
      <label class="r"><span class="l">Kod (untuk akses)</span><input type="text" value="MTB"></label>
      <label class="r"><span class="l">No. SSM</span><input type="text" value="[ ]"></label>
      <label class="r"><span class="l">Negeri</span><select><option>WP Kuala Lumpur</option></select></label>
    </div>

    <span class="sec">WAKTU KERJA</span>
    <div class="box">
      <label class="r"><span class="l">Hujung minggu</span><select><option>Sabtu &amp; Ahad</option><option>Jumaat &amp; Sabtu</option></select></label>

      <label class="r"><span class="l">Had masa kelulusan</span><input type="text" value="5:00 ptg"></label>
    </div>

    <span class="sec">MAJIKAN BERKANUN</span>
    <div class="box">
      <label class="r"><span class="l">No. majikan KWSP</span><input type="text" value="[ ]"></label>
      <label class="r"><span class="l">No. majikan PERKESO</span><input type="text" value="[ ]"></label>
      <label class="r"><span class="l">No. E (LHDN)</span><input type="text" value="E [ ]"></label>
      <label class="r"><span class="l">Berdaftar HRDF</span><select><option>Ya</option><option>Tidak</option></select></label>
