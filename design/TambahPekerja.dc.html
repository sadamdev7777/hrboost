<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Tambah pekerja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6B5F;text-decoration:none}a:hover{color:#0A4F46}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;color:#14211F}
.fld{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.fld input,.fld select{height:44px;box-sizing:border-box;border:1px solid #D5DEDC;border-radius:12px;padding:0 12px;font-family:inherit;font-size:14px;font-weight:600;color:#14211F;background:#FFFFFF}
.sec{font-size:12px;font-weight:700;color:#4A5A57;letter-spacing:0.04em;margin-top:2px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F6F5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14211F; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 6px">
    <a class="back" href="Pekerja.dc.html" aria-label="Kembali"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 800; flex-grow: 1">Tambah pekerja</h1>
    <a href="ImportPekerja.dc.html" style="font-size: 13px; font-weight: 700; padding: 12px">Import Excel</a>
  </header>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 2px 20px 10px">
    <span class="sec">MAKLUMAT PERIBADI</span>
    <label class="fld">Nama penuh (seperti dalam kad pengenalan)<input type="text" placeholder="Nama seperti dalam kad pengenalan"></label>
    <div class="two">
      <label class="fld">Nama panggilan<input type="text" placeholder="Contoh: Nurin"></label>
      <label class="fld">No. WhatsApp<input type="tel" placeholder="01x-xxx xxxx"></label>
    </div>

    <span class="sec">PEKERJAAN DI MTB</span>
    <div class="two">
      <label class="fld">Jabatan<select><option>Tour</option><option>Ticketing</option><option>CEO Office</option></select></label>
      <label class="fld">Jawatan<input type="text" placeholder="Eksekutif Tour"></label>
    </div>
    <div class="two">
      <label class="fld">Tarikh mula<input type="text" value="1 Dis 2026"></label>
      <label class="fld">Jenis<select><option>Tetap</option><option>Kontrak</option><option>Separuh masa</option><option>Pelatih</option></select></label>
    </div>
    <div class="two">
      <label class="fld">Percubaan<select><option>3 bulan</option><option>6 bulan</option><option>Tiada</option></select></label>
      <label class="fld">Gaji pokok (RM)<input type="text" inputmode="decimal" placeholder="0.00"></label>
    </div>
    <div style="background: #FFFFFF; border-radius: 12px; padding: 10px 12px; font-size: 13px; color: #33504B">Ketua: <b>Zuerin</b> (ketua jabatan Tour) · boleh ditukar kemudian</div>

    <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; margin-top: 2px">
      <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #0F6B5F">
      Hantar jemputan WhatsApp sekarang
    </label>
  </div>

  <div style="padding: 10px 20px 26px; background: #FFFFFF; border-top: 1px solid #E2E8E6">
    <a href="Pekerja.dc.html" style="height: 54px; border-radius: 16px; background: #0F6B5F; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Simpan &amp; jemput</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
