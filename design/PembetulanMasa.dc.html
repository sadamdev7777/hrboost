<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Mohon pembetulan masa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6B5F;text-decoration:none}a:hover{color:#0A4F46}
.back{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;color:#14211F}
.fld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.fld input{height:50px;box-sizing:border-box;border:1px solid #D5DEDC;border-radius:12px;padding:0 14px;font-family:inherit;font-size:17px;font-weight:700;color:#14211F;background:#FFFFFF}
.sec{font-size:12px;font-weight:700;color:#4A5A57;letter-spacing:0.04em}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F6F5; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #14211F; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 12px 8px">
    <a class="back" href="Kehadiran.dc.html" aria-label="Kembali"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 800">Betulkan masa</h1>
  </header>

  <div style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column; gap: 14px; padding: 4px 20px 16px">
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
      <span class="sec">REKOD MESIN · JUMAAT, 6 NOV</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B68">Masuk</span><b style="font-size: 18px; color: #92400E">10:02</b></div>
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #5B6B68">Keluar</span><b style="font-size: 18px; color: #5B6B68">Tiada</b></div>
      </div>
    </div>

    <span class="sec">MASA SEBENAR</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label class="fld">Masuk<input type="text" value="8:55"></label>
      <label class="fld">Keluar<input type="text" value="18:05"></label>
    </div>

    <span class="sec">SEBAB</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{reasons}}" as="r" hint-placeholder-count="4">
        <button onClick="{{r.pick}}" style="{{r.style}}">{{r.label}}</button>
      </sc-for>
    </div>
    <label class="fld" style="font-size: 13px">Keterangan (pilihan)
      <input type="text" placeholder="Contoh: berjumpa pelanggan di KLIA terlebih dahulu" style="font-size: 14px; font-weight: 500; height: 46px">
    </label>
    <span style="font-size: 12px; color: #5B6B68">Akan diluluskan oleh Zuerin hari ini. Setelah diluluskan, rekod lewat akan dibatalkan.</span>
  </div>

  <div style="padding: 12px 20px 28px; background: #FFFFFF; border-top: 1px solid #E2E8E6">
    <a href="Kehadiran.dc.html" style="height: 54px; border-radius: 16px; background: #0F6B5F; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center">Hantar permohonan</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { r: 'luar' }; }
  renderVals() {
    const r = this.state.r;
    return {
      reasons: [{ id: 'lupa', l: 'Terlupa mengimbas' }, { id: 'mesin', l: 'Mesin rosak' }, { id: 'luar', l: 'Bertugas di luar pejabat' }, { id: 'lain', l: 'Lain-lain' }].map((x) => ({
        label: x.l,
        style: 'height: 46px; border-radius: 12px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; ' +
          (r === x.id ? 'border: 1.5px solid #0F6B5F; background: #E3F1EE; color: #0F6B5F;' : 'border: 1px solid #D5DEDC; background: #FFFFFF; color: #14211F;'),
        pick: () => this.setState({ r: x.id })
      }))
    };
  }
}
</script>
</body>
</html>
