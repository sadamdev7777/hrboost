# Aplikasi web HRBoost (Next.js) berada dalam folder web/.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Runtime Next.js (SSR, middleware, imej). Dipasang secara jelas kerana projek
# dipasang melalui API, bukan sambungan Git.
[[plugins]]
  package = "@netlify/plugin-nextjs"
